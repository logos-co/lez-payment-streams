[package]
name = "lez_payment_streams-examples"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"


[[bin]]
name = "generate_idl"
path = "src/generate_idl.rs"

[[bin]]
name = "lez_payment_streams_cli"
path = "src/bin/lez_payment_streams_cli.rs"

[[bin]]
name = "seed_localnet_fixture"
path = "src/bin/seed_localnet_fixture.rs"

[[bin]]
name = "bootstrap_testnet_fixture"
path = "src/bin/bootstrap_testnet_fixture.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0", package = "spel-framework" }
spel = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0", package = "spel" }
lez-payment-streams-core = { path = "../program/core" }
serde_json = "1.0"
tokio = { version = "1.28.2", features = ["net", "rt-multi-thread", "sync", "macros"] }
anyhow = "1.0"
base58 = "0.2"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
# LEZ v0.2.0 (Step 26) — match scaffold.toml [repos.lez].pin (seed_localnet_fixture).
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", features = ["client"] }
wallet = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", default-features = false, features = ["artifacts"] }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
