[package]
name = "lez_payment_streams-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[lints]
workspace = true

[profile.release]
# Part of program identity: the ImageID is computed over the release-stripped
# binary, so every deploy/testnet must use this exact profile. A rebuild with a
# different profile produces a different ImageID and invalidates every PDA
# derived from it. Matches the lez-programs convention.
debug = 0
strip = "symbols"

[[bin]]
name = "lez_payment_streams"
path = "src/bin/lez_payment_streams.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0", package = "spel-framework" }
# Stock spel v0.6.0 macros expand to nssa_core::. Guest source keeps lee_core::
# via `extern crate nssa_core as lee_core` (same package cannot have two Cargo names).
# tag=v0.2.0 (not rev=) so Cargo unifies with spel-framework's nssa_core pin.
nssa_core = { package = "lee_core", git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", default-features = false }
risc0-zkvm = { version = "=3.0.5", features = ["std"] }
# Pin ruint below 1.18 (MSRV 1.90); risc0 guest toolchain is rustc 1.88. Matches lez-programs token guest.
ruint = { version = "=1.17.0", default-features = false }
lez-payment-streams-core = { path = "../../lez-payment-streams-core", default-features = false }
authenticated_transfer_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
