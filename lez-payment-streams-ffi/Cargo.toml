[package]
name = "lez-payment-streams-ffi"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "smoke_verify"
path = "src/bin/smoke_verify.rs"

[dependencies]
lez-payment-streams-core = { path = "../lez-payment-streams-core" }
borsh = "1.5"
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", features = ["host"] }
programs = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", default-features = false, features = ["artifacts"] }
hex = "0.4"

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
hex = "0.4"
